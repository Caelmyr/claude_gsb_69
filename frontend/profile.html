<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人主页 - 在线代码评测与竞赛系统</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <div id="nav"></div>

  <div class="container" style="max-width:960px">
    <div id="profileBody"><div class="empty"><span class="spinner"></span> 加载中…</div></div>
  </div>

  <script src="/assets/app.js"></script>
  <script>
    OJ.boot("profile");
    const ROLE = { admin: "管理员", judge: "裁判", user: "普通用户" };
    const STATUS = { upcoming: "未开始", running: "进行中", ended: "已结束" };

    async function load() {
      const box = OJ.el("profileBody");
      let key = new URLSearchParams(location.search).get("u") || "";
      if (!key) {
        // 未指定用户时，默认展示当前登录用户自己的主页
        const me = OJ.currentUser();
        if (me) key = me.username;
        else { box.innerHTML = `<div class="empty">缺少用户参数，请从排行榜、提交记录或讨论区点击用户名进入</div>`; return; }
      }
      try {
        const d = await OJ.api("/profile/" + encodeURIComponent(key));
        render(d);
      } catch (e) {
        box.innerHTML = `<div class="empty">😕 ${OJ.esc(e.message)}</div>`;
      }
    }

    function render(d) {
      const u = d.user || {};
      const st = d.stats || {};
      const initial = (u.nickname || u.username || "?").slice(0, 1).toUpperCase();
      const me = OJ.currentUser();
      const isMe = me && me.id === u.id;

      const solvedRows = (d.solved_problems || []).map(p => `
        <tr style="cursor:pointer" onclick="location.href='/problem.html?id=${encodeURIComponent(p.id)}'">
          <td class="mono">${OJ.esc(p.id)}</td>
          <td>${OJ.esc(p.title)}</td>
          <td class="text-center">${OJ.difficultyLabel(p.difficulty)}</td>
          <td class="mono muted">${OJ.fmtTime(p.solved_at)}</td>
        </tr>`).join("");

      const contestRows = (d.contests || []).map(c => `
        <tr>
          <td><a href="/leaderboard.html?contest=${encodeURIComponent(c.id)}">${OJ.esc(c.title)}</a></td>
          <td class="text-center">${c.mode === "acm" ? "ACM" : "IOI"}</td>
          <td class="text-center">${STATUS[c.status] || OJ.esc(c.status)}</td>
          <td class="text-center">${c.rank ? `<span class="rank-${c.rank <= 3 ? c.rank : ""}" style="font-weight:700">第 ${c.rank} 名</span>` : "-"}</td>
          <td class="text-center mono">${c.mode === "acm" ? c.solved + " 题" : c.score + " 分"}</td>
        </tr>`).join("");

      OJ.el("profileBody").innerHTML = `
        <div class="card">
          <div class="profile-head">
            <div class="avatar">${OJ.esc(initial)}</div>
            <div>
              <h1 style="font-size:20px">${OJ.esc(u.nickname || u.username)}
                ${u.role && u.role !== "user" ? `<span class="role-tag">${ROLE[u.role] || OJ.esc(u.role)}</span>` : ""}
                ${isMe ? `<span class="role-tag">我</span>` : ""}
              </h1>
              <div class="muted" style="font-size:13px">@${OJ.esc(u.username)} · 注册于 ${OJ.fmtTime(u.created_at)}</div>
            </div>
          </div>
        </div>

        <div class="stat-grid">
          <div class="stat-card"><div class="val" style="color:var(--green)">${st.solved || 0}</div><div class="lbl">通过题目</div></div>
          <div class="stat-card"><div class="val">${st.submissions || 0}</div><div class="lbl">总提交</div></div>
          <div class="stat-card"><div class="val">${st.accepted || 0}</div><div class="lbl">通过提交</div></div>
          <div class="stat-card"><div class="val" style="color:var(--primary)">${st.contests || 0}</div><div class="lbl">参加竞赛</div></div>
        </div>

        <div class="card">
          <div class="card-title">✅ 已通过的题目（${(d.solved_problems || []).length}）</div>
          ${solvedRows
            ? `<div class="table-wrap"><table>
                <thead><tr><th>题号</th><th>标题</th><th class="text-center">难度</th><th>首次通过时间</th></tr></thead>
                <tbody>${solvedRows}</tbody></table></div>`
            : `<div class="empty">还没有通过任何题目</div>`}
        </div>

        <div class="card">
          <div class="card-title">🏆 参赛记录（${(d.contests || []).length}）</div>
          ${contestRows
            ? `<div class="table-wrap"><table>
                <thead><tr><th>竞赛</th><th class="text-center">模式</th><th class="text-center">状态</th><th class="text-center">名次</th><th class="text-center">成绩</th></tr></thead>
                <tbody>${contestRows}</tbody></table></div>`
            : `<div class="empty">还没有参加过竞赛</div>`}
        </div>`;
    }

    load();
  </script>
</body>
</html>
